# Render Blueprint: MoneyPilot API (Hono backend) + Neon PostgreSQL.
# Production topology: GitHub -> Vercel (apps/web, frontend-only) +
# Render (apps/api, this blueprint) -> Neon PostgreSQL.
# The web app proxies every /api/* request, same-origin, to this service
# (next.config.ts rewrites + MONEYPILOT_API_ORIGIN), so browsers never talk
# cross-origin, no CORS headers are needed, and the __Host- auth cookies land
# on the web origin. See docs/deployment.md for the full guide.
services:
  - type: web
    name: moneypilot-api
    runtime: node
    plan: starter # adjust to your needs
    region: frankfurt # pick the region closest to your users
    rootDir: apps/api
    # Render installs workspace dependencies from the repository root
    # package-lock.json (postinstall generates the SQLite dev client; the
    # build command regenerates the canonical PostgreSQL client, then the
    # esbuild bundle).
    buildCommand: npx prisma generate && npm run build
    startCommand: node dist/server.js
    preDeployCommand: node scripts/check-prod-env.mjs && npx prisma migrate deploy
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon PostgreSQL connection string (pooled endpoint recommended).
      # Example: postgresql://user:pass@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # HMAC secret for access tokens. At least 32 characters.
      # Generate: node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: AUTH_JWT_SECRET
        sync: false
      # Public https:// URL of the WEB app (the Vercel deployment), e.g.
      # https://moneypilot.vercel.app or your custom domain. Used for email
      # links and the CSRF origin check (browsers send the web origin through
      # the proxy). Update it whenever the web app's URL changes.
      - key: APP_BASE_URL
        sync: false
      # Invite-only registration: "true" requires invitation tokens.
      - key: PRIVATE_MODE
        value: "false"
      # Web-session lifetime in days.
      - key: AUTH_REFRESH_TTL_DAYS
        value: "30"
      # Optional extra origins accepted by the CSRF check (comma separated),
      # e.g. a staging web URL or a custom domain during migration.
      # - key: ALLOWED_ORIGINS
      #   sync: false
      # "Continue with Google" (optional): OAuth 2.0 Web-application
      # credentials from the Google Cloud Console. The authorized redirect URI
      # is <APP_BASE_URL>/api/auth/google/callback. Unset = Google sign-in
      # disabled (everything else works).
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # SMTP (optional until a mailer provider is configured).
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
