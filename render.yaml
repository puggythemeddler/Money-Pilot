# Render Blueprint: MoneyPilot API (Hono backend) + Neon PostgreSQL.
# Production topology: GitHub -> Vercel (apps/web, frontend-only) +
# Render (apps/api, this blueprint) -> Neon PostgreSQL.
# The web app proxies every /api/* request, same-origin, to this service
# (next.config.ts rewrites + MONEYPILOT_API_ORIGIN), so browsers never talk
# cross-origin, no CORS headers are needed, and the __Host- auth cookies land
# on the web origin. See docs/deployment.md for the full guide.
#
# The service root is the REPOSITORY ROOT, not apps/api: this is an npm
# workspaces monorepo, so `npm install` must run where the root package.json,
# package-lock.json and packages/shared live for @moneypilot/shared to resolve
# (files outside a service's root directory are not available to the build).
# All commands below run from the repo root and reference apps/api by path.
# The buildFilter preserves the "only redeploy for api/shared changes"
# behaviour that a subsdirectory root directory used to provide.
services:
  - type: web
    name: moneypilot-api
    runtime: node
    plan: free # test deployment; pick a paid plan for production workloads
    region: frankfurt # pick the region closest to your users
    # npm install installs only the api + shared workspaces (skips apps/web
    # and apps/e2e, whose Playwright install would download browsers on every
    # build). postinstall of @moneypilot/api generates the SQLite dev client;
    # the build step validates the environment, regenerates the canonical
    # PostgreSQL client, applies migrations, and bundles the server.
    #
    # Render Free does not support pre-deploy commands, so the env check and
    # `prisma migrate deploy` run here, in the build pipeline, instead.
    buildCommand: npm install --workspace @moneypilot/shared --workspace @moneypilot/api && cd apps/api && node scripts/check-prod-env.mjs && npx prisma generate && npx prisma migrate deploy && npm run build
    # Env guard on start too: fail fast with a clear message if a required
    # production variable goes missing after the build.
    startCommand: node apps/api/scripts/check-prod-env.mjs && node apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package-lock.json
        - package.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # Neon PostgreSQL connection string (pooled endpoint recommended).
      # Example: postgresql://user:pass@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # HMAC secret for access tokens. At least 32 characters.
      # Generate: node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: AUTH_JWT_SECRET
        sync: false
      # Public https:// URL of the WEB app (the Vercel deployment), e.g.
      # https://moneypilot.vercel.app or your custom domain. Used for email
      # links and the CSRF origin check (browsers send the web origin through
      # the proxy). Update it whenever the web app's URL changes.
      - key: APP_BASE_URL
        sync: false
      # Invite-only registration: "true" requires invitation tokens.
      - key: PRIVATE_MODE
        value: "false"
      # Web-session lifetime in days.
      - key: AUTH_REFRESH_TTL_DAYS
        value: "30"
      # Optional extra origins accepted by the CSRF check (comma separated),
      # e.g. a staging web URL or a custom domain during migration.
      # - key: ALLOWED_ORIGINS
      #   sync: false
      # "Continue with Google" (optional): OAuth 2.0 Web-application
      # credentials from the Google Cloud Console. The authorized redirect URI
      # is <APP_BASE_URL>/api/auth/google/callback. Unset = Google sign-in
      # disabled (everything else works).
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # SMTP (optional until a mailer provider is configured).
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false