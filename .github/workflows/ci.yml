name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall generates the SQLite dev client; the production build
      # regenerates the canonical PostgreSQL client (no database needed).
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (shared domain rules + api linking rules)
        run: npm run test

      # The API bundles with esbuild after typechecking; the canonical
      # PostgreSQL client is generated first (postinstall generated the
      # SQLite dev client).
      - name: Production build (api)
        run: |
          npx prisma generate
          npm run build
        working-directory: apps/api

      # The web app is frontend-only (no Prisma): the build compiles the
      # Next.js app that proxies /api/* to the MoneyPilot API.
      - name: Production build (web)
        run: npm run build
        working-directory: apps/web

  audit:
    name: dependency audit (high and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # npm audit reads the lockfile only — no install needed. The gate
      # script allows a reviewed list of build-time-only advisories.
      - name: Audit production dependencies
        run: node scripts/audit.mjs

  e2e:
    name: playwright e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      # The e2e orchestrator (apps/e2e/scripts/e2e-server.mjs) rebuilds both
      # apps on boot against a fresh SQLite database; building here first
      # keeps failures easier to attribute.
      - name: Build api service
        run: npx prisma generate && npm run build
        working-directory: apps/api

      - name: Build web app
        run: npm run build
        working-directory: apps/web

      - name: Run e2e suite
        run: npm run e2e
        working-directory: apps/e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  semgrep:
    name: semgrep static security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep scan (custom rules + registry)
        run: semgrep scan --config security/semgrep-rules.yml --config auto --error
