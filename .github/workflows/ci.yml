name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall generates the SQLite dev client; the production build
      # regenerates the canonical PostgreSQL client (no database needed).
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (shared domain rules)
        run: npm run test -- --filter=@moneypilot/shared

      - name: Production build (web)
        run: |
          npx prisma generate
          npm run build
        working-directory: apps/web

  audit:
    name: dependency audit (high and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm audit reads the lockfile only — no install needed. The gate
      # script allows a reviewed list of build-time-only advisories.
      - name: Audit production dependencies
        run: node scripts/audit.mjs

  e2e:
    name: playwright e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      # The e2e server builds the web app on first boot if .next is missing;
      # building here first keeps failures easier to attribute.
      - name: Build web app
        run: npx prisma generate && npm run build
        working-directory: apps/web

      - name: Run e2e suite
        run: npm run e2e
        working-directory: apps/e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  semgrep:
    name: semgrep static security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (custom rules + registry)
        run: semgrep scan --config security/semgrep-rules.yml --config auto --error
